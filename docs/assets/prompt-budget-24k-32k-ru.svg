<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1100" viewBox="0 0 760 1100" role="img" aria-labelledby="title desc">
<title id="title">Контекст: цель C и защита + P</title><desc id="desc">Рекомендации 24k и 32k; защита P вне C; ручные значения не ограничиваются целью.</desc>
<rect width="760" height="1100" rx="16" fill="#fff"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172b42">
<text x="28" y="44" font-size="31" font-weight="700" text-anchor="start">Контекст: цель C и защита + P</text>
<text x="28" y="83" font-size="25" font-weight="400" text-anchor="start">Общая шкала 32k · рекомендации по кнопке</text>
<text x="28" y="126" font-size="29" font-weight="700" text-anchor="start">Цель C = 24k</text>
<rect x="36" y="146" width="172" height="84" rx="0" fill="#f6cb85" stroke="#fff" stroke-width="2"/>
<text x="122" y="175" font-size="23" font-weight="650" text-anchor="middle">H</text>
<text x="122" y="213" font-size="29" font-weight="700" text-anchor="middle">8k</text>
<rect x="208" y="146" width="129" height="84" rx="0" fill="#ffe8a3" stroke="#fff" stroke-width="2"/>
<text x="272.5" y="175" font-size="23" font-weight="650" text-anchor="middle">R</text>
<text x="272.5" y="213" font-size="29" font-weight="700" text-anchor="middle">6k</text>
<rect x="337" y="146" width="64.5" height="84" rx="0" fill="#f9b6a8" stroke="#fff" stroke-width="2"/>
<text x="369.25" y="175" font-size="23" font-weight="650" text-anchor="middle">T</text>
<text x="369.25" y="213" font-size="29" font-weight="700" text-anchor="middle">3k</text>
<rect x="401.5" y="146" width="64.5" height="84" rx="0" fill="#bcd9f5" stroke="#fff" stroke-width="2"/>
<text x="433.75" y="175" font-size="23" font-weight="650" text-anchor="middle">W</text>
<text x="433.75" y="213" font-size="29" font-weight="700" text-anchor="middle">3k</text>
<rect x="466" y="146" width="86" height="84" rx="0" fill="#b9e0ca" stroke="#fff" stroke-width="2"/>
<text x="509" y="175" font-size="23" font-weight="650" text-anchor="middle">F</text>
<text x="509" y="213" font-size="29" font-weight="700" text-anchor="middle">4k</text>
<path d="M552,138 v100" stroke="#9c3d30" stroke-width="3" stroke-dasharray="6 4"/>
<text x="36" y="268" font-size="27" font-weight="650" text-anchor="start">H8 + R6 + T3 + W3 + F4 = N24k</text>
<rect x="36" y="288" width="688" height="57" rx="10" fill="#e0d4f5" stroke="#9278b1" stroke-dasharray="7 5" stroke-width="2"/>
<text x="53" y="324" font-size="25" font-weight="650" text-anchor="start">+ P · защищённый текст; размер переменный</text>
<text x="28" y="390" font-size="29" font-weight="700" text-anchor="start">Цель C = 32k</text>
<rect x="36" y="410" width="258" height="84" rx="0" fill="#f6cb85" stroke="#fff" stroke-width="2"/>
<text x="165" y="439" font-size="23" font-weight="650" text-anchor="middle">H</text>
<text x="165" y="477" font-size="29" font-weight="700" text-anchor="middle">12k</text>
<rect x="294" y="410" width="172" height="84" rx="0" fill="#ffe8a3" stroke="#fff" stroke-width="2"/>
<text x="380" y="439" font-size="23" font-weight="650" text-anchor="middle">R</text>
<text x="380" y="477" font-size="29" font-weight="700" text-anchor="middle">8k</text>
<rect x="466" y="410" width="86" height="84" rx="0" fill="#f9b6a8" stroke="#fff" stroke-width="2"/>
<text x="509" y="439" font-size="23" font-weight="650" text-anchor="middle">T</text>
<text x="509" y="477" font-size="29" font-weight="700" text-anchor="middle">4k</text>
<rect x="552" y="410" width="86" height="84" rx="0" fill="#bcd9f5" stroke="#fff" stroke-width="2"/>
<text x="595" y="439" font-size="23" font-weight="650" text-anchor="middle">W</text>
<text x="595" y="477" font-size="29" font-weight="700" text-anchor="middle">4k</text>
<rect x="638" y="410" width="86" height="84" rx="0" fill="#b9e0ca" stroke="#fff" stroke-width="2"/>
<text x="681" y="439" font-size="23" font-weight="650" text-anchor="middle">F</text>
<text x="681" y="477" font-size="29" font-weight="700" text-anchor="middle">4k</text>
<path d="M724,402 v100" stroke="#9c3d30" stroke-width="3" stroke-dasharray="6 4"/>
<text x="36" y="532" font-size="27" font-weight="650" text-anchor="start">H12 + R8 + T4 + W4 + F4 = N32k</text>
<rect x="36" y="552" width="688" height="57" rx="10" fill="#e0d4f5" stroke="#9278b1" stroke-dasharray="7 5" stroke-width="2"/>
<text x="53" y="588" font-size="25" font-weight="650" text-anchor="start">+ P · защищённый текст; размер переменный</text>
<rect x="30" y="669" width="28" height="28" rx="5" fill="#f6cb85" stroke="#fff" stroke-width="2"/>
<text x="72" y="692" font-size="25" font-weight="600" text-anchor="start">H · История: весь L″ + найденные оригиналы</text>
<rect x="30" y="711" width="28" height="28" rx="5" fill="#ffe8a3" stroke="#fff" stroke-width="2"/>
<text x="72" y="734" font-size="25" font-weight="600" text-anchor="start">R · Постоянный сырой хвост</text>
<rect x="30" y="753" width="28" height="28" rx="5" fill="#f9b6a8" stroke="#fff" stroke-width="2"/>
<text x="72" y="776" font-size="25" font-weight="600" text-anchor="start">T · Рост сырого текста до начала сжатия</text>
<rect x="30" y="795" width="28" height="28" rx="5" fill="#bcd9f5" stroke="#fff" stroke-width="2"/>
<text x="72" y="818" font-size="25" font-weight="600" text-anchor="start">W · Активация WI</text>
<rect x="30" y="837" width="28" height="28" rx="5" fill="#b9e0ca" stroke="#fff" stroke-width="2"/>
<text x="72" y="860" font-size="25" font-weight="600" text-anchor="start">F · Резерв карточки / system / hints</text>
<text x="28" y="910" font-size="25" font-weight="650" text-anchor="start">P переменный, не входит в полосу C.</text>
<text x="28" y="951" font-size="24" font-weight="400" text-anchor="start">Ручной N может быть больше C; скрытых клампов нет.</text>
<text x="28" y="990" font-size="24" font-weight="400" text-anchor="start">Максимум raw = R + T; защита + P отдельно.</text>
<text x="28" y="1029" font-size="24" font-weight="400" text-anchor="start">B = 24k максимум на вызов ≠ T = 4k (при C32).</text>
<text x="28" y="1068" font-size="24" font-weight="400" text-anchor="start">Окно модели и резерв ответа задаются в ST.</text>
</g></svg>
