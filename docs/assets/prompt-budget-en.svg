<svg xmlns="http://www.w3.org/2000/svg" width="760" height="838" viewBox="0 0 760 838" role="img" aria-labelledby="title desc">
<title id="title">Context target C, plus protected P</title><desc id="desc">24k recommendation; protected P is outside C; manual values are not clamped.</desc>
<rect width="760" height="838" rx="16" fill="#fff"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172b42">
<text x="28" y="44" font-size="31" font-weight="700" text-anchor="start">Context target C, plus protected P</text>
<text x="28" y="83" font-size="25" font-weight="400" text-anchor="start">Common 32k scale · explicit button recommendations</text>
<text x="28" y="126" font-size="29" font-weight="700" text-anchor="start">Target C = 24k</text>
<rect x="36" y="146" width="172" height="84" rx="0" fill="#f6cb85" stroke="#fff" stroke-width="2"/>
<text x="122" y="175" font-size="23" font-weight="650" text-anchor="middle">H</text>
<text x="122" y="213" font-size="29" font-weight="700" text-anchor="middle">8k</text>
<rect x="208" y="146" width="129" height="84" rx="0" fill="#ffe8a3" stroke="#fff" stroke-width="2"/>
