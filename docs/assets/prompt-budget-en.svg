<text x="72" y="598" font-size="25" font-weight="600" text-anchor="start">F · Card / system / hints planning reserve</text>
<text x="28" y="648" font-size="25" font-weight="650" text-anchor="start">P is variable, outside the C bar.</text>
<text x="28" y="689" font-size="24" font-weight="400" text-anchor="start">Manual N may exceed C; no hidden clamping.</text>
<text x="28" y="728" font-size="24" font-weight="400" text-anchor="start">Maximum raw = R + T; protected P is extra.</text>
<text x="28" y="767" font-size="24" font-weight="400" text-anchor="start">B = 24k max/call ≠ T = 3k (C24 recommendation).</text>
<text x="28" y="806" font-size="24" font-weight="400" text-anchor="start">Set model context and output reserve in ST.</text>
