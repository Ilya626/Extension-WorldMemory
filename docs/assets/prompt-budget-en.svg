<text x="72" y="430" font-size="25" font-weight="600" text-anchor="start">H · History: full L″ + retrieved originals</text>
<rect x="30" y="449" width="28" height="28" rx="5" fill="#ffe8a3" stroke="#fff" stroke-width="2"/>
<text x="72" y="472" font-size="25" font-weight="600" text-anchor="start">R · Permanent raw tail</text>
<rect x="30" y="491" width="28" height="28" rx="5" fill="#f9b6a8" stroke="#fff" stroke-width="2"/>
<text x="72" y="514" font-size="25" font-weight="600" text-anchor="start">T · Raw growth before compression starts</text>
