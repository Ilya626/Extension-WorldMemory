<text x="272.5" y="213" font-size="29" font-weight="700" text-anchor="middle">6k</text>
<rect x="337" y="146" width="64.5" height="84" rx="0" fill="#f9b6a8" stroke="#fff" stroke-width="2"/>
<text x="369.25" y="175" font-size="23" font-weight="650" text-anchor="middle">T</text>
<text x="369.25" y="213" font-size="29" font-weight="700" text-anchor="middle">3k</text>
<rect x="401.5" y="146" width="64.5" height="84" rx="0" fill="#bcd9f5" stroke="#fff" stroke-width="2"/>
