<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1244" viewBox="0 0 760 1244" role="img" aria-labelledby="title desc">
<title id="title">Inside History: H8k and H12k</title><desc id="desc">Full L″4100 and labels 300 stay unchanged; details3600 or7600; originals follow their matching steps.</desc>
<rect width="760" height="1244" rx="16" fill="#fff"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172b42">
<text x="28" y="44" font-size="31" font-weight="700" text-anchor="start">Inside History: H8k and H12k</text>
<text x="28" y="83" font-size="27" font-weight="600" text-anchor="start">C24k → H8k · C32k → H12k</text>
<rect x="28" y="106" width="704" height="100" rx="10" fill="#f4f7fb" stroke="#fff" stroke-width="2"/>
<text x="43" y="135" font-size="25" font-weight="700" text-anchor="start">1 · Keep the complete compact L″</text>
<text x="43" y="166" font-size="24" font-weight="400" text-anchor="start">One skeleton: A 1,900 + B 2,200 = 4,100.</text>
<text x="43" y="195" font-size="24" font-weight="400" text-anchor="start">Every packet, in both history allowances.</text>
<rect x="28" y="218" width="704" height="100" rx="10" fill="#f4f7fb" stroke="#fff" stroke-width="2"/>
<text x="43" y="247" font-size="25" font-weight="700" text-anchor="start">2 · Search independently from the player post</text>
<text x="43" y="278" font-size="24" font-weight="400" text-anchor="start">Words / lemmas + embeddings + search notes.</text>
<text x="43" y="307" font-size="24" font-weight="400" text-anchor="start">Rank windows; merge overlapping passages.</text>
<rect x="28" y="330" width="704" height="100" rx="10" fill="#f4f7fb" stroke="#fff" stroke-width="2"/>
<text x="43" y="359" font-size="25" font-weight="700" text-anchor="start">3 · Spend the remainder on whole originals</text>
<text x="43" y="390" font-size="24" font-weight="400" text-anchor="start">H8k: details 3,600 · H12k: details 7,600.</text>
<text x="43" y="419" font-size="24" font-weight="400" text-anchor="start">L″ 4,100 and labels 300 stay the same.</text>
<rect x="28" y="442" width="704" height="100" rx="10" fill="#f4f7fb" stroke="#fff" stroke-width="2"/>
<text x="43" y="471" font-size="25" font-weight="700" text-anchor="start">4 · Add originals after their matching steps</text>
<text x="43" y="502" font-size="24" font-weight="400" text-anchor="start">A → details A → B → details B.</text>
<text x="43" y="531" font-size="24" font-weight="400" text-anchor="start">Search selects detail; chronology sets order.</text>
<text x="28" y="610" font-size="28" font-weight="700" text-anchor="start">History H = 8k</text>
<rect x="36" y="630" width="108.933" height="88" rx="0" fill="#f6cb85" stroke="#fff" stroke-width="2"/>
<text x="90.4667" y="661" font-size="23" font-weight="650" text-anchor="middle">L″ A</text>
<text x="90.4667" y="698" font-size="26" font-weight="700" text-anchor="middle">1.9k</text>
<rect x="144.933" y="630" width="103.2" height="88" rx="0" fill="#ffe8a3" stroke="#fff" stroke-width="2"/>
<text x="196.533" y="661" font-size="23" font-weight="650" text-anchor="middle">Hits A</text>
<text x="196.533" y="698" font-size="26" font-weight="700" text-anchor="middle">1.8k</text>
<rect x="248.133" y="630" width="126.133" height="88" rx="0" fill="#f6cb85" stroke="#fff" stroke-width="2"/>
<text x="311.2" y="661" font-size="23" font-weight="650" text-anchor="middle">L″ B</text>
<text x="311.2" y="698" font-size="26" font-weight="700" text-anchor="middle">2.2k</text>
<rect x="374.267" y="630" width="103.2" height="88" rx="0" fill="#ffe8a3" stroke="#fff" stroke-width="2"/>
<text x="425.867" y="661" font-size="23" font-weight="650" text-anchor="middle">Hits B</text>
<text x="425.867" y="698" font-size="26" font-weight="700" text-anchor="middle">1.8k</text>
<rect x="477.467" y="630" width="17.2" height="88" rx="0" fill="#d8cdf3" stroke="#fff" stroke-width="2"/>
<text x="28" y="757" font-size="24" font-weight="650" text-anchor="start">L″ 4,100 + details 3,600 + labels 300 = 8,000</text>
<text x="28" y="802" font-size="28" font-weight="700" text-anchor="start">History H = 12k</text>
<rect x="36" y="822" width="108.933" height="88" rx="0" fill="#f6cb85" stroke="#fff" stroke-width="2"/>
<text x="90.4667" y="853" font-size="23" font-weight="650" text-anchor="middle">L″ A</text>
<text x="90.4667" y="890" font-size="26" font-weight="700" text-anchor="middle">1.9k</text>
<rect x="144.933" y="822" width="217.867" height="88" rx="0" fill="#ffe8a3" stroke="#fff" stroke-width="2"/>
<text x="253.867" y="853" font-size="23" font-weight="650" text-anchor="middle">Hits A</text>
<text x="253.867" y="890" font-size="26" font-weight="700" text-anchor="middle">3.8k</text>
<rect x="362.8" y="822" width="126.133" height="88" rx="0" fill="#f6cb85" stroke="#fff" stroke-width="2"/>
<text x="425.867" y="853" font-size="23" font-weight="650" text-anchor="middle">L″ B</text>
<text x="425.867" y="890" font-size="26" font-weight="700" text-anchor="middle">2.2k</text>
<rect x="488.933" y="822" width="217.867" height="88" rx="0" fill="#ffe8a3" stroke="#fff" stroke-width="2"/>
<text x="597.867" y="853" font-size="23" font-weight="650" text-anchor="middle">Hits B</text>
<text x="597.867" y="890" font-size="26" font-weight="700" text-anchor="middle">3.8k</text>
<rect x="706.8" y="822" width="17.2" height="88" rx="0" fill="#d8cdf3" stroke="#fff" stroke-width="2"/>
<text x="28" y="949" font-size="24" font-weight="650" text-anchor="start">L″ 4,100 + details 7,600 + labels 300 = 12,000</text>
<text x="28" y="1004" font-size="24" font-weight="600" text-anchor="start">Orange: L″ · yellow: originals · purple: labels</text>
<text x="28" y="1044" font-size="24" font-weight="400" text-anchor="start">Common 12k scale. Composition sizes are illustrative.</text>
<text x="28" y="1084" font-size="24" font-weight="650" text-anchor="start">More source detail; the same skeleton, never doubled.</text>
<text x="28" y="1124" font-size="24" font-weight="400" text-anchor="start">Whole windows / full L″ may exceed allowance H.</text>
<text x="28" y="1164" font-size="24" font-weight="400" text-anchor="start">R, T, W, F and protected P are outside History H.</text>
<text x="28" y="1204" font-size="24" font-weight="400" text-anchor="start">No extra LLM judge call for each RP reply.</text>
</g></svg>
