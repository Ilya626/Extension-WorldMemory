<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc"><title id="title">Inside the History segment: how ~8,000 tokens are assembled</title><desc id="desc">Zoom into the orange part of the whole-input bar. The fragments below are illustrative, not player data. This segment is selected again before each reply</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#9f6817"/></marker></defs><rect width="1200" height="1070" rx="16" fill="white"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172b42"><text x="36" y="45" font-size="28" font-weight="700" >Inside the History segment: how ~8,000 tokens are assembled</text><text x="36" y="80" font-size="17" font-weight="400" >Zoom into the orange part of the whole-input bar. The fragments below are illustrative, not player data.</text><rect x="48" y="108" width="132" height="58" fill="#eef1f5" stroke="white" stroke-width="3"/><text x="114" y="143" font-size="19" font-weight="400" text-anchor="middle">Setup</text><rect x="180" y="108" width="352" height="58" fill="#f6cb85" stroke="white" stroke-width="3"/><text x="356" y="143" font-size="19" font-weight="700" text-anchor="middle">History 8,000</text><rect x="532" y="108" width="352" height="58" fill="#eef1f5" stroke="white" stroke-width="3"/><text x="708" y="143" font-size="19" font-weight="400" text-anchor="middle">Raw tail</text><rect x="884" y="108" width="132" height="58" fill="#eef1f5" stroke="white" stroke-width="3"/><text x="950" y="143" font-size="19" font-weight="400" text-anchor="middle">WI</text><rect x="1016" y="108" width="88" height="58" fill="#eef1f5" stroke="white" stroke-width="3"/><text x="1060" y="143" font-size="15" font-weight="400" text-anchor="middle">Post</text><path d="M356,170 L356,202" fill="none" stroke="#9f6817" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="232" font-size="23" font-weight="650" >This segment is selected again before each reply</text><rect x="36" y="252" width="1128" height="100" rx="10" fill="#f7f9fc"/><circle cx="66" cy="279" r="16" fill="#f6cb85"/><text x="66" y="286" font-size="19" font-weight="700" text-anchor="middle">1</text><text x="96" y="285" font-size="20" font-weight="650" >First assemble a compact chronology of the available game</text><text x="53" y="314" font-size="17" font-weight="400" >Each L0 stores source-bound L″: its beginning, development and unresolved conditions.</text><text x="53" y="339" font-size="17" font-weight="400" >The global skeleton is assembled locally. New steps arrive in the same reply as their L0.</text><rect x="36" y="362" width="1128" height="100" rx="10" fill="#f7f9fc"/><circle cx="66" cy="389" r="16" fill="#f6cb85"/><text x="66" y="396" font-size="19" font-weight="700" text-anchor="middle">2</text><text x="96" y="395" font-size="20" font-weight="650" >Independent retrieval ranks originals using the player post</text><text x="53" y="424" font-size="17" font-weight="400" >Words / lemmas and embeddings give, for example: #71 → #18 → #4 → #42. This is relevance order.</text><text x="53" y="449" font-size="17" font-weight="400" >Source vectors are reused; embedding a new query may call the API. No extra LLM judge is involved.</text><rect x="36" y="472" width="1128" height="100" rx="10" fill="#f7f9fc"/><circle cx="66" cy="499" r="16" fill="#f6cb85"/><text x="66" y="506" font-size="19" font-weight="700" text-anchor="middle">3</text><text x="96" y="505" font-size="20" font-weight="650" >The skeleton and labels consume the allowance before expansions</text><text x="53" y="534" font-size="17" font-weight="400" >Example: compact sections use 4,100, labels 300; expanded originals can use the remaining 3,600.</text><text x="53" y="559" font-size="17" font-weight="400" >A hit expands its complete bounded source cell. The last expansion can exceed the soft target.</text><rect x="36" y="582" width="1128" height="100" rx="10" fill="#f7f9fc"/><circle cx="66" cy="609" r="16" fill="#f6cb85"/><text x="66" y="616" font-size="19" font-weight="700" text-anchor="middle">4</text><text x="96" y="615" font-size="20" font-weight="650" >Hits expand in place; other skeleton steps stay compact</text><text x="53" y="644" font-size="17" font-weight="400" >One stream: compact A → original #18 → compact B → original #71 → separate recent raw chat.</text><text x="53" y="669" font-size="17" font-weight="400" >Rank sets detail; source chronology sets order. Search failure does not remove the skeleton.</text><text x="36" y="724" font-size="22" font-weight="700" >Inside History: the complete chronology at varying detail</text><rect x="48" y="748" width="250.79999999999998" height="90" fill="#f6cb85" stroke="white" stroke-width="2"/><text x="173.39999999999998" y="780" font-size="19" font-weight="600" text-anchor="middle">Skeleton A</text><text x="173.39999999999998" y="815" font-size="25" font-weight="700" text-anchor="middle">1,900</text><rect x="298.79999999999995" y="748" width="237.6" height="90" fill="#ffe8a3" stroke="white" stroke-width="2"/><text x="417.59999999999997" y="780" font-size="19" font-weight="600" text-anchor="middle">Source #18</text><text x="417.59999999999997" y="815" font-size="25" font-weight="700" text-anchor="middle">1,800</text><rect x="536.4" y="748" width="290.40000000000003" height="90" fill="#f6cb85" stroke="white" stroke-width="2"/><text x="681.6" y="780" font-size="19" font-weight="600" text-anchor="middle">Skeleton B</text><text x="681.6" y="815" font-size="25" font-weight="700" text-anchor="middle">2,200</text><rect x="826.8" y="748" width="237.6" height="90" fill="#ffe8a3" stroke="white" stroke-width="2"/><text x="945.5999999999999" y="780" font-size="19" font-weight="600" text-anchor="middle">Source #71</text><text x="945.5999999999999" y="815" font-size="25" font-weight="700" text-anchor="middle">1,800</text><rect x="1064.3999999999999" y="748" width="39.6" height="90" fill="#d8cdf3" stroke="white" stroke-width="2"/><text x="1084.1999999999998" y="780" font-size="11" font-weight="600" text-anchor="middle">Labels</text><text x="1084.1999999999998" y="815" font-size="14" font-weight="700" text-anchor="middle">300</text><text x="36" y="875" font-size="18" font-weight="600" >1,900 + 1,800 + 2,200 + 1,800 + 300 = 8,000. Fragment sizes and counts here are illustrative.</text><rect x="36" y="902" width="1128" height="140" rx="10" fill="#fff3ec"/><text x="52" y="936" font-size="17" font-weight="400" >Skeleton and expansions share 8,000. Raw tail, WI and setup are counted separately.</text><text x="52" y="973" font-size="17" font-weight="400" >Legacy without L″ keeps full labelled L0 until explicit preparation. The input can become much larger.</text><text x="52" y="1010" font-size="17" font-weight="400" >The soft target never clips the skeleton or limits storage. Generated L″ quality is still being evaluated.</text></g></svg>