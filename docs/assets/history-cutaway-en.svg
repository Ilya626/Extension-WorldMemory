<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc"><title id="title">Inside the History segment: how ~8,000 tokens are assembled</title><desc id="desc">Zoom into the orange part of the whole-input bar. The fragments below are illustrative, not player data. This segment is selected again before each reply</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#9f6817"/></marker></defs><rect width="1200" height="1070" rx="16" fill="white"/><g font-family="Segoe UI,Arial,sans-serif" fill="#172b42"><text x="36" y="45" font-size="28" font-weight="700" >Inside the History segment: how ~8,000 tokens are assembled</text><text x="36" y="80" font-size="17" font-weight="400" >Zoom into the orange part of the whole-input bar. The fragments below are illustrative, not player data.</text><rect x="48" y="108" width="132" height="58" fill="#eef1f5" stroke="white" stroke-width="3"/><text x="114" y="143" font-size="19" font-weight="400" text-anchor="middle">Setup</text><rect x="180" y="108" width="352" height="58" fill="#f6cb85" stroke="white" stroke-width="3"/><text x="356" y="143" font-size="19" font-weight="700" text-anchor="middle">History 8,000</text><rect x="532" y="108" width="352" height="58" fill="#eef1f5" stroke="white" stroke-width="3"/><text x="708" y="143" font-size="19" font-weight="400" text-anchor="middle">Raw tail</text><rect x="884" y="108" width="132" height="58" fill="#eef1f5" stroke="white" stroke-width="3"/><text x="950" y="143" font-size="19" font-weight="400" text-anchor="middle">WI</text><rect x="1016" y="108" width="88" height="58" fill="#eef1f5" stroke="white" stroke-width="3"/><text x="1060" y="143" font-size="15" font-weight="400" text-anchor="middle">Post</text><path d="M356,170 L356,202" fill="none" stroke="#9f6817" stroke-width="2" marker-end="url(#arrow)"/><text x="48" y="232" font-size="23" font-weight="650" >This segment is selected again before each reply</text><rect x="36" y="252" width="1128" height="100" rx="10" fill="#f7f9fc"/><circle cx="66" cy="279" r="16" fill="#f6cb85"/><text x="66" y="286" font-size="19" font-weight="700" text-anchor="middle">1</text><text x="96" y="285" font-size="20" font-weight="650" >The latest player post becomes the search query</text><text x="53" y="314" font-size="17" font-weight="400" >Words / word forms and, by default, the post embedding search an index of stored original messages.</text><text x="53" y="339" font-size="17" font-weight="400" >L0 stays in the archive; linked L′, exact search notes and hints help ranking when they are available.</text><rect x="36" y="362" width="1128" height="100" rx="10" fill="#f7f9fc"/><circle cx="66" cy="389" r="16" fill="#f6cb85"/><text x="66" y="396" font-size="19" font-weight="700" text-anchor="middle">2</text><text x="96" y="395" font-size="20" font-weight="650" >Candidates are first ranked by relevance</text><text x="53" y="424" font-size="17" font-weight="400" >Example search order: #42 → #4 → #71 → #18. This is relevance order, not chronology.</text><text x="53" y="449" font-size="17" font-weight="400" >Source vectors are reused; embedding a new query may call the API. No extra LLM judge is involved.</text><rect x="36" y="472" width="1128" height="100" rx="10" fill="#f7f9fc"/><circle cx="66" cy="499" r="16" fill="#f6cb85"/><text x="66" y="506" font-size="19" font-weight="700" text-anchor="middle">3</text><text x="96" y="505" font-size="20" font-weight="650" >Whole original-text windows fill the soft target</text><text x="53" y="534" font-size="17" font-weight="400" >A hit includes neighboring chunks of that same message; it is not necessarily a whole dialogue exchange.</text><text x="53" y="559" font-size="17" font-weight="400" >Max history tokens = 8,000 includes the wrapper and labels; the last whole window can exceed it.</text><rect x="36" y="582" width="1128" height="100" rx="10" fill="#f7f9fc"/><circle cx="66" cy="609" r="16" fill="#f6cb85"/><text x="66" y="616" font-size="19" font-weight="700" text-anchor="middle">4</text><text x="96" y="615" font-size="20" font-weight="650" >Overlap merges, then selected excerpts follow story order</text><text x="53" y="644" font-size="17" font-weight="400" >Overlapping ranges of one source merge; blocks are sorted by source message and text offset.</text><text x="53" y="669" font-size="17" font-weight="400" >The request gets #4 → #18 → #42 → #71, even though the search found them in a different order.</text><text x="36" y="724" font-size="22" font-weight="700" >What actually enters the history segment: original excerpts with labels</text><rect x="48" y="748" width="250.79999999999998" height="90" fill="#f6cb85" stroke="white" stroke-width="2"/><text x="173.39999999999998" y="780" font-size="19" font-weight="600" text-anchor="middle">Source #4</text><text x="173.39999999999998" y="815" font-size="25" font-weight="700" text-anchor="middle">1,900</text><rect x="298.79999999999995" y="748" width="237.6" height="90" fill="#ffe8a3" stroke="white" stroke-width="2"/><text x="417.59999999999997" y="780" font-size="19" font-weight="600" text-anchor="middle">Source #18</text><text x="417.59999999999997" y="815" font-size="25" font-weight="700" text-anchor="middle">1,800</text><rect x="536.4" y="748" width="290.40000000000003" height="90" fill="#f6cb85" stroke="white" stroke-width="2"/><text x="681.6" y="780" font-size="19" font-weight="600" text-anchor="middle">Source #42</text><text x="681.6" y="815" font-size="25" font-weight="700" text-anchor="middle">2,200</text><rect x="826.8" y="748" width="237.6" height="90" fill="#ffe8a3" stroke="white" stroke-width="2"/><text x="945.5999999999999" y="780" font-size="19" font-weight="600" text-anchor="middle">Source #71</text><text x="945.5999999999999" y="815" font-size="25" font-weight="700" text-anchor="middle">1,800</text><rect x="1064.3999999999999" y="748" width="39.6" height="90" fill="#d8cdf3" stroke="white" stroke-width="2"/><text x="1084.1999999999998" y="780" font-size="11" font-weight="600" text-anchor="middle">Labels</text><text x="1084.1999999999998" y="815" font-size="14" font-weight="700" text-anchor="middle">300</text><text x="36" y="875" font-size="18" font-weight="600" >1,900 + 1,800 + 2,200 + 1,800 + 300 = 8,000. Fragment sizes and counts here are illustrative.</text><rect x="36" y="902" width="1128" height="140" rx="10" fill="#fff3ec"/><text x="52" y="936" font-size="17" font-weight="400" >Other candidates remain archived. Raw tail, WI and character/setup do not use this 8,000-token allowance.</text><text x="52" y="973" font-size="17" font-weight="400" >Full L0/L′ are usually not inserted. Edited memories or summaries without originals may enter with explicit labels.</text><text x="52" y="1010" font-size="17" font-weight="400" >Max history tokens changes selection size; it cannot guarantee every fact will be found and does not cap the archive.</text></g></svg>