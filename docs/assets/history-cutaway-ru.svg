<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1244" viewBox="0 0 760 1244" role="img" aria-labelledby="title desc">
<title id="title">Внутри истории: H8k и H12k</title><desc id="desc">Полный L″4100 и подписи 300 неизменны; детали3600 или7600; оригиналы после своих пунктов.</desc>
<rect width="760" height="1244" rx="16" fill="#fff"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172b42">
<text x="28" y="44" font-size="31" font-weight="700" text-anchor="start">Внутри истории: H8k и H12k</text>
<text x="28" y="83" font-size="27" font-weight="600" text-anchor="start">C24k → H8k · C32k → H12k</text>
<rect x="28" y="106" width="704" height="100" rx="10" fill="#f4f7fb" stroke="#fff" stroke-width="2"/>
<text x="43" y="135" font-size="25" font-weight="700" text-anchor="start">1 · Весь короткий L″ остаётся</text>
<text x="43" y="166" font-size="24" font-weight="400" text-anchor="start">Один скелет: A 1 900 + B 2 200 = 4 100.</text>
<text x="43" y="195" font-size="24" font-weight="400" text-anchor="start">Во всех пакетах и при обоих бюджетах.</text>
<rect x="28" y="218" width="704" height="100" rx="10" fill="#f4f7fb" stroke="#fff" stroke-width="2"/>
<text x="43" y="247" font-size="25" font-weight="700" text-anchor="start">2 · Поиск по посту игрока идёт отдельно</text>
<text x="43" y="278" font-size="24" font-weight="400" text-anchor="start">Слова / леммы + эмбеддинги + заметки.</text>
<text x="43" y="307" font-size="24" font-weight="400" text-anchor="start">Выбрать окна; объединить пересечения.</text>
<rect x="28" y="330" width="704" height="100" rx="10" fill="#f4f7fb" stroke="#fff" stroke-width="2"/>
<text x="43" y="359" font-size="25" font-weight="700" text-anchor="start">3 · Остаток — целым оригинальным выдержкам</text>
<text x="43" y="390" font-size="24" font-weight="400" text-anchor="start">H8k: детали 3 600 · H12k: детали 7 600.</text>
<text x="43" y="419" font-size="24" font-weight="400" text-anchor="start">L″ 4 100 и подписи 300 не увеличиваются.</text>
<rect x="28" y="442" width="704" height="100" rx="10" fill="#f4f7fb" stroke="#fff" stroke-width="2"/>
<text x="43" y="471" font-size="25" font-weight="700" text-anchor="start">4 · Выдержки — после своих пунктов истории</text>
<text x="43" y="502" font-size="24" font-weight="400" text-anchor="start">A → детали A → B → детали B.</text>
<text x="43" y="531" font-size="24" font-weight="400" text-anchor="start">Поиск выбирает детали, хронология — порядок.</text>
<text x="28" y="610" font-size="28" font-weight="700" text-anchor="start">История H = 8k</text>
<rect x="36" y="630" width="108.933" height="88" rx="0" fill="#f6cb85" stroke="#fff" stroke-width="2"/>
<text x="90.4667" y="661" font-size="23" font-weight="650" text-anchor="middle">L″ A</text>
<text x="90.4667" y="698" font-size="26" font-weight="700" text-anchor="middle">1.9k</text>
<rect x="144.933" y="630" width="103.2" height="88" rx="0" fill="#ffe8a3" stroke="#fff" stroke-width="2"/>
<text x="196.533" y="661" font-size="23" font-weight="650" text-anchor="middle">Дет.A</text>
<text x="196.533" y="698" font-size="26" font-weight="700" text-anchor="middle">1.8k</text>
<rect x="248.133" y="630" width="126.133" height="88" rx="0" fill="#f6cb85" stroke="#fff" stroke-width="2"/>
<text x="311.2" y="661" font-size="23" font-weight="650" text-anchor="middle">L″ B</text>
<text x="311.2" y="698" font-size="26" font-weight="700" text-anchor="middle">2.2k</text>
<rect x="374.267" y="630" width="103.2" height="88" rx="0" fill="#ffe8a3" stroke="#fff" stroke-width="2"/>
<text x="425.867" y="661" font-size="23" font-weight="650" text-anchor="middle">Дет.B</text>
<text x="425.867" y="698" font-size="26" font-weight="700" text-anchor="middle">1.8k</text>
<rect x="477.467" y="630" width="17.2" height="88" rx="0" fill="#d8cdf3" stroke="#fff" stroke-width="2"/>
<text x="28" y="757" font-size="24" font-weight="650" text-anchor="start">L″ 4 100 + детали 3 600 + подписи 300 = 8 000</text>
<text x="28" y="802" font-size="28" font-weight="700" text-anchor="start">История H = 12k</text>
<rect x="36" y="822" width="108.933" height="88" rx="0" fill="#f6cb85" stroke="#fff" stroke-width="2"/>
<text x="90.4667" y="853" font-size="23" font-weight="650" text-anchor="middle">L″ A</text>
<text x="90.4667" y="890" font-size="26" font-weight="700" text-anchor="middle">1.9k</text>
<rect x="144.933" y="822" width="217.867" height="88" rx="0" fill="#ffe8a3" stroke="#fff" stroke-width="2"/>
<text x="253.867" y="853" font-size="23" font-weight="650" text-anchor="middle">Дет.A</text>
<text x="253.867" y="890" font-size="26" font-weight="700" text-anchor="middle">3.8k</text>
<rect x="362.8" y="822" width="126.133" height="88" rx="0" fill="#f6cb85" stroke="#fff" stroke-width="2"/>
<text x="425.867" y="853" font-size="23" font-weight="650" text-anchor="middle">L″ B</text>
<text x="425.867" y="890" font-size="26" font-weight="700" text-anchor="middle">2.2k</text>
<rect x="488.933" y="822" width="217.867" height="88" rx="0" fill="#ffe8a3" stroke="#fff" stroke-width="2"/>
<text x="597.867" y="853" font-size="23" font-weight="650" text-anchor="middle">Дет.B</text>
<text x="597.867" y="890" font-size="26" font-weight="700" text-anchor="middle">3.8k</text>
<rect x="706.8" y="822" width="17.2" height="88" rx="0" fill="#d8cdf3" stroke="#fff" stroke-width="2"/>
<text x="28" y="949" font-size="24" font-weight="650" text-anchor="start">L″ 4 100 + детали 7 600 + подписи 300 = 12 000</text>
<text x="28" y="1004" font-size="24" font-weight="600" text-anchor="start">Оранжевый: L″ · жёлтый: оригиналы · сиреневый: подписи</text>
<text x="28" y="1044" font-size="24" font-weight="400" text-anchor="start">Общая шкала 12k. Числа здесь — пример состава.</text>
<text x="28" y="1084" font-size="24" font-weight="650" text-anchor="start">Больше деталей; скелет тот же, без удвоения.</text>
<text x="28" y="1124" font-size="24" font-weight="400" text-anchor="start">Целые окна / весь L″ могут превысить бюджет H.</text>
<text x="28" y="1164" font-size="24" font-weight="400" text-anchor="start">R, T, W, F и защита P не входят в историю H.</text>
<text x="28" y="1204" font-size="24" font-weight="400" text-anchor="start">Нет дополнительного LLM-судьи на каждый ход.</text>
</g></svg>
