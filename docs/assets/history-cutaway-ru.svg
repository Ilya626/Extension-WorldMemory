<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1280" viewBox="0 0 960 1280" role="img" aria-labelledby="title desc">
<title id="title">Разрез истории: 8k и 16k</title><desc id="desc">Разрез истории: 8k и 16k. Illustrative numbers, not measured token use.</desc>
<rect x="0" y="0" width="960" height="1280" rx="16" fill="#ffffff" stroke="white" stroke-width="2"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172b42">
<text x="36" y="46" font-size="30" font-weight="700" text-anchor="start">Разрез истории: 8k и 16k</text>
<text x="36" y="84" font-size="23" font-weight="400" text-anchor="start">Сегмент 2 общей полосы: 24k → история 8k; 32k → история 16k.</text>
<rect x="36" y="110" width="888" height="98" rx="10" fill="#f7f9fc" stroke="white" stroke-width="2"/>
<rect x="36" y="220" width="888" height="118" rx="10" fill="#f7f9fc" stroke="white" stroke-width="2"/>
<rect x="36" y="350" width="888" height="98" rx="10" fill="#f7f9fc" stroke="white" stroke-width="2"/>
<rect x="36" y="460" width="888" height="98" rx="10" fill="#f7f9fc" stroke="white" stroke-width="2"/>
<text x="52" y="141" font-size="25" font-weight="700" text-anchor="start">1 · Сначала весь доступный L″, без отбора по поиску</text>
<text x="52" y="172" font-size="23" font-weight="400" text-anchor="start">Все краткие пункты всех пакетов остаются целиком.</text>
<text x="52" y="200" font-size="23" font-weight="400" text-anchor="start">В ОБОИХ примерах: скелет A 1 900 + B 2 200 = 4 100.</text>
<text x="52" y="253" font-size="25" font-weight="700" text-anchor="start">2 · Независимый поиск по посту игрока</text>
<text x="52" y="285" font-size="23" font-weight="400" text-anchor="start">Оригиналы + заметки; слова/леммы + эмбеддинги.</text>
<text x="52" y="312" font-size="23" font-weight="400" text-anchor="start">Окна ранжируются по релевантности; пересечения объединяются.</text>
<text x="52" y="381" font-size="25" font-weight="700" text-anchor="start">3 · Остаток бюджета — целым исходным выдержкам</text>
<text x="52" y="413" font-size="22" font-weight="400" text-anchor="start">Бюджет − L″ 4 100 − подписи 300: 8k → 3 600; 16k → 11 600.</text>
<text x="52" y="441" font-size="23" font-weight="400" text-anchor="start">Больше места для найденных деталей; скелет не удваивается.</text>
<text x="52" y="491" font-size="25" font-weight="700" text-anchor="start">4 · Каждая выдержка — после своего пункта хронологии</text>
<text x="52" y="523" font-size="23" font-weight="400" text-anchor="start">A → детали #18 → B → детали #71. Пункты L″ не заменяются.</text>
<text x="52" y="551" font-size="23" font-weight="400" text-anchor="start">Поиск выбирает детали; хронология задаёт порядок.</text>
<text x="36" y="606" font-size="26" font-weight="700" text-anchor="start">Один полный скелет, разная подробность исходников</text>
<text x="48" y="646" font-size="18" font-weight="600" text-anchor="middle">0</text>
<text x="264" y="646" font-size="18" font-weight="600" text-anchor="middle">4k</text>
<text x="480" y="646" font-size="18" font-weight="600" text-anchor="middle">8k</text>
<text x="696" y="646" font-size="18" font-weight="600" text-anchor="middle">12k</text>
<text x="912" y="646" font-size="18" font-weight="600" text-anchor="middle">16k</text>
<text x="36" y="690" font-size="25" font-weight="700" text-anchor="start">История 8k внутри общего входа 24k</text>
<rect x="48" y="712" width="102.6" height="88" rx="0" fill="#f6cb85" stroke="white" stroke-width="2"/>
<text x="99.3" y="743" font-size="22" font-weight="600" text-anchor="middle">L″ A</text>
<text x="99.3" y="780" font-size="26" font-weight="700" text-anchor="middle">1.9k</text>
<rect x="150.6" y="712" width="97.2" height="88" rx="0" fill="#ffe8a3" stroke="white" stroke-width="2"/>
<text x="199.2" y="743" font-size="22" font-weight="600" text-anchor="middle">Дет. A</text>
<text x="199.2" y="780" font-size="26" font-weight="700" text-anchor="middle">1.8k</text>
<rect x="247.8" y="712" width="118.8" height="88" rx="0" fill="#f6cb85" stroke="white" stroke-width="2"/>
<text x="307.2" y="743" font-size="22" font-weight="600" text-anchor="middle">L″ B</text>
<text x="307.2" y="780" font-size="26" font-weight="700" text-anchor="middle">2.2k</text>
<rect x="366.6" y="712" width="97.2" height="88" rx="0" fill="#ffe8a3" stroke="white" stroke-width="2"/>
<text x="415.2" y="743" font-size="22" font-weight="600" text-anchor="middle">Дет. B</text>
<text x="415.2" y="780" font-size="26" font-weight="700" text-anchor="middle">1.8k</text>
<rect x="463.8" y="712" width="16.2" height="88" rx="0" fill="#d8cdf3" stroke="white" stroke-width="2"/>
<text x="36" y="838" font-size="24" font-weight="650" text-anchor="start">L″ 4 100 + детали 3 600 + подписи 300 = 8 000</text>
<text x="36" y="892" font-size="25" font-weight="700" text-anchor="start">История 16k внутри общего входа 32k</text>
<rect x="48" y="914" width="102.6" height="88" rx="0" fill="#f6cb85" stroke="white" stroke-width="2"/>
<text x="99.3" y="945" font-size="22" font-weight="600" text-anchor="middle">L″ A</text>
<text x="99.3" y="982" font-size="26" font-weight="700" text-anchor="middle">1.9k</text>
<rect x="150.6" y="914" width="313.2" height="88" rx="0" fill="#ffe8a3" stroke="white" stroke-width="2"/>
<text x="307.2" y="945" font-size="22" font-weight="600" text-anchor="middle">Выдержки A</text>
<text x="307.2" y="982" font-size="26" font-weight="700" text-anchor="middle">5.8k</text>
<rect x="463.8" y="914" width="118.8" height="88" rx="0" fill="#f6cb85" stroke="white" stroke-width="2"/>
<text x="523.2" y="945" font-size="22" font-weight="600" text-anchor="middle">L″ B</text>
<text x="523.2" y="982" font-size="26" font-weight="700" text-anchor="middle">2.2k</text>
<rect x="582.6" y="914" width="313.2" height="88" rx="0" fill="#ffe8a3" stroke="white" stroke-width="2"/>
<text x="739.2" y="945" font-size="22" font-weight="600" text-anchor="middle">Выдержки B</text>
<text x="739.2" y="982" font-size="26" font-weight="700" text-anchor="middle">5.8k</text>
<rect x="895.8" y="914" width="16.2" height="88" rx="0" fill="#d8cdf3" stroke="white" stroke-width="2"/>
<text x="36" y="1040" font-size="24" font-weight="650" text-anchor="start">L″ 4 100 + детали 11 600 + подписи 300 = 16 000</text>
<text x="36" y="1080" font-size="22" font-weight="600" text-anchor="start">Оранжевый: L″ A/B · жёлтый: оригиналы · фиолетовый: подписи 300</text>
<text x="36" y="1118" font-size="22" font-weight="400" text-anchor="start">Общая шкала 16k; жёлтые блоки суммируют целые исходные выдержки.</text>
<text x="36" y="1154" font-size="22" font-weight="400" text-anchor="start">Числа условны: реальные размеры L″, подписей и деталей меняются.</text>
<text x="36" y="1190" font-size="22" font-weight="400" text-anchor="start">Целые окна могут превысить ориентир. Без L″ остаётся полный L0.</text>
<text x="36" y="1226" font-size="22" font-weight="400" text-anchor="start">Хвост, WI, карточка и подсказка событий — вне этого сегмента.</text>
<text x="36" y="1262" font-size="20" font-weight="400" text-anchor="start">Векторы переиспользуются; query embedding может вызвать API. LLM-судьи нет.</text>
</g></svg>
