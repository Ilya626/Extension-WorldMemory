<svg xmlns="http://www.w3.org/2000/svg" width="960" height="836" viewBox="0 0 960 836" role="img" aria-labelledby="title desc">
<title id="title">RP input: 24k and 32k examples together</title><desc id="desc">RP input: 24k and 32k examples together. Illustrative numbers, not measured token use.</desc>
<rect x="0" y="0" width="960" height="836" rx="16" fill="#ffffff" stroke="white" stroke-width="2"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#172b42">
<text x="36" y="46" font-size="30" font-weight="700" text-anchor="start">RP input: 24k and 32k examples together</text>
<text x="36" y="84" font-size="23" font-weight="400" text-anchor="start">Common 32k scale; example sizes, not reserved space.</text>
<text x="36" y="134" font-size="26" font-weight="700" text-anchor="start">24k · fresh-install history and input target</text>
<text x="48" y="160" font-size="18" font-weight="600" text-anchor="middle">0</text>
<text x="264" y="160" font-size="18" font-weight="600" text-anchor="middle">8k</text>
<text x="480" y="160" font-size="18" font-weight="600" text-anchor="middle">16k</text>
<text x="696" y="160" font-size="18" font-weight="600" text-anchor="middle">24k</text>
<text x="912" y="160" font-size="18" font-weight="600" text-anchor="middle">32k</text>
<rect x="48" y="176" width="81" height="84" rx="0" fill="#b9e0ca" stroke="white" stroke-width="2"/>
<text x="88.5" y="203" font-size="20" font-weight="600" text-anchor="middle">1</text>
<text x="88.5" y="240" font-size="27" font-weight="700" text-anchor="middle">3k</text>
<rect x="129" y="176" width="216" height="84" rx="0" fill="#f6cb85" stroke="white" stroke-width="2"/>
<text x="237" y="203" font-size="20" font-weight="600" text-anchor="middle">2</text>
<text x="237" y="240" font-size="27" font-weight="700" text-anchor="middle">8k</text>
<rect x="345" y="176" width="216" height="84" rx="0" fill="#ffe8a3" stroke="white" stroke-width="2"/>
<text x="453" y="203" font-size="20" font-weight="600" text-anchor="middle">3</text>
<text x="453" y="240" font-size="27" font-weight="700" text-anchor="middle">8k</text>
<rect x="561" y="176" width="81" height="84" rx="0" fill="#bcd9f5" stroke="white" stroke-width="2"/>
<text x="601.5" y="203" font-size="20" font-weight="600" text-anchor="middle">4</text>
<text x="601.5" y="240" font-size="27" font-weight="700" text-anchor="middle">3k</text>
<rect x="642" y="176" width="54" height="84" rx="0" fill="#d8cdf3" stroke="white" stroke-width="2"/>
<text x="669" y="203" font-size="20" font-weight="600" text-anchor="middle">5</text>
<text x="669" y="240" font-size="27" font-weight="700" text-anchor="middle">2k</text>
<path d="M696,168 v100" stroke="#be4132" stroke-width="3" stroke-dasharray="6 4"/>
<text x="48" y="296" font-size="25" font-weight="650" text-anchor="start">3k + 8k + 8k + 3k + 2k = 24k</text>
<text x="36" y="344" font-size="26" font-weight="700" text-anchor="start">32k · more room for retrieved history</text>
<rect x="48" y="366" width="81" height="84" rx="0" fill="#b9e0ca" stroke="white" stroke-width="2"/>
<text x="88.5" y="393" font-size="20" font-weight="600" text-anchor="middle">1</text>
<text x="88.5" y="430" font-size="27" font-weight="700" text-anchor="middle">3k</text>
<rect x="129" y="366" width="432" height="84" rx="0" fill="#f6cb85" stroke="white" stroke-width="2"/>
<text x="345" y="393" font-size="20" font-weight="600" text-anchor="middle">2</text>
<text x="345" y="430" font-size="27" font-weight="700" text-anchor="middle">16k</text>
<rect x="561" y="366" width="216" height="84" rx="0" fill="#ffe8a3" stroke="white" stroke-width="2"/>
<text x="669" y="393" font-size="20" font-weight="600" text-anchor="middle">3</text>
<text x="669" y="430" font-size="27" font-weight="700" text-anchor="middle">8k</text>
<rect x="777" y="366" width="81" height="84" rx="0" fill="#bcd9f5" stroke="white" stroke-width="2"/>
<text x="817.5" y="393" font-size="20" font-weight="600" text-anchor="middle">4</text>
<text x="817.5" y="430" font-size="27" font-weight="700" text-anchor="middle">3k</text>
<rect x="858" y="366" width="54" height="84" rx="0" fill="#d8cdf3" stroke="white" stroke-width="2"/>
<text x="885" y="393" font-size="20" font-weight="600" text-anchor="middle">5</text>
<text x="885" y="430" font-size="27" font-weight="700" text-anchor="middle">2k</text>
<path d="M912,358 v100" stroke="#be4132" stroke-width="3" stroke-dasharray="6 4"/>
<text x="48" y="486" font-size="25" font-weight="650" text-anchor="start">3k + 16k + 8k + 3k + 2k = 32k</text>
<text x="36" y="532" font-size="23" font-weight="600" text-anchor="start">1 Setup 3k · 2 History 8k/16k · 3 Raw tail 8k</text>
<text x="36" y="568" font-size="23" font-weight="600" text-anchor="start">4 WI 3k · 5 Protected exchange + current post 2k</text>
<text x="36" y="604" font-size="22" font-weight="400" text-anchor="start">3k / 3k / 2k are illustrative; 32k / 16k are not new defaults.</text>
<rect x="36" y="624" width="888" height="88" rx="10" fill="#fff3ec" stroke="white" stroke-width="2"/>
<text x="52" y="657" font-size="24" font-weight="700" text-anchor="start">32k: Max history tokens → 16,000</text>
<text x="52" y="693" font-size="24" font-weight="650" text-anchor="start">Full RP prompt target → 32,000; Raw tail = 8,000</text>
<text x="36" y="747" font-size="21" font-weight="400" text-anchor="start">Model window / output reserve: ST. Whole fragments can exceed soft targets.</text>
<text x="36" y="783" font-size="21" font-weight="600" text-anchor="start">Optional event evidence OFF; if ON, it adds to the same total ST context.</text>
<text x="36" y="818" font-size="21" font-weight="400" text-anchor="start">Its cap: 12,000 characters, whole rows, not a token allowance.</text>
</g></svg>
